server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect HTTP → HTTPS when behind proxy (Coolify/Traefik)
    # Skip redirect for /health (Coolify health checks) and when already HTTPS
    set $redirect_https 1;
    if ($request_uri ~ ^/health) { set $redirect_https 0; }
    # Mesma isenção para o marcador de versão: ele é lido por script
    # (CI, diagnóstico) e um 301 no caminho viraria "versão não confere".
    if ($request_uri ~ ^/version\.json) { set $redirect_https 0; }
    if ($http_x_forwarded_proto = 'https') { set $redirect_https 0; }
    if ($redirect_https = 1) { return 301 https://$host$request_uri; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (must match before SPA fallback)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|map|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: no-cache so users get updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root "/" - explicit SPA entry
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    # Capture site: social media crawlers get OG meta tags from backend
    set $is_crawler "";
    if ($http_user_agent ~* "facebookexternalhit|Facebot|LinkedInBot|Twitterbot|WhatsApp|TelegramBot|Slackbot|Discordbot|Pinterest") {
        set $is_crawler "1";
    }
    location ~ ^/c/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/c/$1/og;
        }
        try_files $uri /index.html;
    }

    # Custom links: same OG treatment for social media crawlers
    location ~ ^/l/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/l/$1/og;
        }
        try_files $uri /index.html;
    }

    # SPA fallback: all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SHA do commit que gerou este bundle. É o que o CI lê para PROVAR que o
    # deploy trocou o container — o hash do arquivo do bundle diz que o
    # conteúdo mudou, este diz QUAL commit é.
    #
    # `no-store` obrigatório: sem ele o Cloudflare (proxy laranja na frente de
    # marketdash.com.br) poderia servir a versão anterior e o CI aprovaria um
    # deploy que não aconteceu — exatamente o modo de falha que ele existe
    # para pegar.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
