# Qual API atende cada domínio. Espelha API_BY_HOST de src/core/config/api.config.ts:
# as locations abaixo mandam o VISITANTE inteiro ao backend, então um host fixo
# aqui faria homologação servir /g e /conectar a partir da API de PRODUÇÃO — que
# nem tem as tabelas do módulo. O default é produção porque `server_name _`
# atende qualquer host; um domínio novo sem entrada aqui cai nele.
map $host $api_upstream {
    default                 api.marketdash.com.br;
    hml.marketdash.com.br   api.hml.marketdash.com.br;
    marketdash.hml.com.br   api.marketdash.hml.com.br;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect HTTP → HTTPS when behind proxy (Coolify/Traefik)
    # Skip redirect for /health (Coolify health checks) and when already HTTPS
    set $redirect_https 1;
    if ($request_uri ~ ^/health) { set $redirect_https 0; }
    # Mesma isenção para o marcador de versão: ele é lido por script
    # (CI, diagnóstico) e um 301 no caminho viraria "versão não confere".
    if ($request_uri ~ ^/version\.json) { set $redirect_https 0; }
    if ($http_x_forwarded_proto = 'https') { set $redirect_https 0; }
    if ($redirect_https = 1) { return 301 https://$host$request_uri; }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets (must match before SPA fallback)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|map|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html: no-cache so users get updates
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Root "/" - explicit SPA entry
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        try_files /index.html =404;
    }

    # Capture site: social media crawlers get OG meta tags from backend
    set $is_crawler "";
    if ($http_user_agent ~* "facebookexternalhit|Facebot|LinkedInBot|Twitterbot|WhatsApp|TelegramBot|Slackbot|Discordbot|Pinterest") {
        set $is_crawler "1";
    }
    location ~ ^/c/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/c/$1/og;
        }
        try_files $uri /index.html;
    }

    # Custom links: same OG treatment for social media crawlers
    location ~ ^/l/([^/]+)$ {
        if ($is_crawler = "1") {
            return 302 https://api.marketdash.com.br/l/$1/og;
        }
        try_files $uri /index.html;
    }

    # proxy_pass com variável resolve DNS em RUNTIME e exige um resolver.
    # DNS público de propósito, e não o 127.0.0.11 do Docker: o DNS embutido só
    # existe em rede definida pelo usuário, e na bridge padrão ele recusa a
    # conexão — o /g inteiro cairia por causa da topologia da rede. Os dois
    # upstreams são nomes públicos, então um resolver público sempre serve.
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

    # Link de entrada dos grupos: a página INTEIRA vem do backend — ela escolhe
    # o grupo com vaga, registra o clique e dispara o pixel antes do redirect.
    # Não é só OG para crawler como /c e /l: aqui todo visitante vai ao backend.
    location ~ ^/g/(preview/)?([^/]+)$ {
        proxy_pass https://$api_upstream$request_uri;
        proxy_set_header Host $api_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # Conexão externa (item 18): a página de pareamento vem inteira do backend,
    # e ela CONSULTA o backend em laço para atualizar o QR. Por isso são duas
    # locations: a página e o endpoint que ela chama. Sem a segunda, o polling
    # cairia no SPA e o QR nunca apareceria — foi o que aconteceu com o /g na F6.
    location ~ ^/conectar/([^/]+)$ {
        proxy_pass https://$api_upstream$request_uri;
        proxy_set_header Host $api_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location ~ ^/api/conectar/([^/]+)/qr$ {
        proxy_pass https://$api_upstream$request_uri;
        proxy_set_header Host $api_upstream;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # SPA fallback: all other routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SHA do commit que gerou este bundle. É o que o CI lê para PROVAR que o
    # deploy trocou o container — o hash do arquivo do bundle diz que o
    # conteúdo mudou, este diz QUAL commit é.
    #
    # `no-store` obrigatório: sem ele o Cloudflare (proxy laranja na frente de
    # marketdash.com.br) poderia servir a versão anterior e o CI aprovaria um
    # deploy que não aconteceu — exatamente o modo de falha que ele existe
    # para pegar.
    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
