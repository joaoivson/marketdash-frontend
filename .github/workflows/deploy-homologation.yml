name: Deploy to Homologation

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'README.md'

# Homologação e produção compartilham o VPS de 4 vCPU com o backend, e o
# Coolify constrói as imagens ali mesmo. Em 11/09/2026 dois builds simultâneos
# levaram a CPU a 100% e a API de produção ficou ~20h fora. Grupo IGUAL nos
# dois workflows para que um espere o outro.
concurrency:
  group: coolify-build-vps-frontend
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Code
    outputs:
      bundle: ${{ steps.bundle.outputs.nome }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "⚠️ Linter found issues (warnings allowed)"
        continue-on-error: true

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Test build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.hml.marketdash.com.br' }}


      # O nome do arquivo do Vite é hash do conteúdo: é a identidade do build
      # deste commit, e serve de gabarito para conferir depois do deploy se o
      # que está no ar é ESTE código ou o anterior.
      - name: Registrar o bundle deste build
        id: bundle
        run: |
          nome=$(ls dist/assets/index-*.js 2>/dev/null | head -1 | sed 's|^dist||')
          echo "bundle deste commit: ${nome:-(não encontrado)}"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
      - name: Check build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Build failed: dist directory not found"
            exit 1
          fi
          echo "✅ Build successful"

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # O passo antigo era um curl com `|| echo "Deployment triggered"`, que
      # engolia qualquer falha (URL vazia, 404, timeout) e ainda imprimia
      # sucesso. É o mesmo defeito que deixou o worker Celery com código de
      # semanas atrás e o CI verde. O script confere o HTTP e falha alto.

      # Hash servido ANTES de disparar: sem ele não dá para distinguir "deploy
      # não chegou" de "deploy chegou e o hash é outro".
      - name: Anotar o bundle que está no ar agora
        id: antes
        run: |
          atual=$(curl -s --max-time 25 "https://hml.marketdash.com.br/" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "no ar antes do deploy: ${atual:-(não lido)}"
          echo "nome=$atual" >> "$GITHUB_OUTPUT"

      # O grupo de `concurrency` do GitHub é POR REPOSITÓRIO: ele impede que os
      # dois deploys DESTE repo construam juntos, mas não enxerga o repo do
      # backend. Como os dois constroem no mesmo VPS de 4 vCPU, sem esta espera
      # um deploy de frontend ainda pode cair em cima de um de backend — que é
      # o tipo de sobreposição que derrubou produção em 11/09. A fila do
      # Coolify é do servidor inteiro, então esperar por ela cobre os dois repos.
      - name: Esperar o VPS parar de construir antes de disparar
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/aguardar-build.sh
          .github/scripts/aguardar-build.sh "${{ secrets.COOLIFY_DEPLOY_URL_FRONTEND_HML }}"
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          chmod +x .github/scripts/trigger-deploy.sh
          .github/scripts/trigger-deploy.sh frontend "${{ secrets.COOLIFY_DEPLOY_URL_FRONTEND_HML }}"


      # "Webhook aceito" nunca foi "código no ar". Três vezes registradas o
      # ambiente seguiu servindo o bundle antigo em silêncio.
      - name: Confirmar que o bundle novo está no ar
        run: |
          chmod +x .github/scripts/confirmar-bundle.sh
          .github/scripts/confirmar-bundle.sh \
            "https://hml.marketdash.com.br" \
            "${{ steps.antes.outputs.nome }}" \
            "${{ needs.validate.outputs.bundle }}"
      - name: Deployment status
        run: |
          echo "✅ Deployment triggered for homologation (develop branch)"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
