name: Deploy to Homologation

# O build da imagem acontece AQUI, no runner. O VPS só puxa.
#
# Gêmeo do deploy-production.yml, com duas diferenças: branch `develop` e SEM
# gate de aprovação — homologação é para testar, e travar aqui só ensinaria a
# ignorar o gate de produção. Ver o cabeçalho do outro arquivo para o porquê
# de o build ter saído do VPS.
#
# ## As VITE_* agora vêm de GitHub Variables
#
# Antes, quem fornecia as variáveis de build era o painel do Coolify — o CI
# construía com OUTROS valores só para testar e jogava fora. Por isso o hash do
# bundle do CI nunca batia com o do ar, e `confirmar-bundle.sh` tinha um
# caminho de "⚠️ trocou, mas com outro hash". Agora é o mesmo artefato: o hash
# tem que bater exatamente.

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag já publicada no GHCR (rollback ou redeploy), ex: hml-<sha>. Vazio = constrói este commit.'
        required: false
        default: ''

concurrency:
  group: deploy-frontend-hml
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGEM: ghcr.io/joaoivson/marketdash-frontend

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # igual ao da imagem; antes o CI usava 18 e a
                               # imagem 20, então os dois builds não eram o mesmo
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "⚠️ lint com avisos"
        continue-on-error: true

      # `npx tsc --noEmit` na raiz NÃO valida nada: o tsconfig.json tem
      # `"files": []` e o comando sai 0 mesmo com erro de tipo em src/. Só o
      # -p tsconfig.app.json olha o código. Há ~25 erros pré-existentes, então
      # o critério é "não aumentou", não "zero".
      - name: Type check (src/ de verdade)
        run: |
          erros=$(npx tsc -p tsconfig.app.json --noEmit 2>&1 | grep -c "error TS" || true)
          echo "erros de tipo: $erros (baseline: 25 na develop)"
          if [ "$erros" -gt 25 ]; then
            echo "::error::número de erros de tipo aumentou ($erros > 25)"
            exit 1
          fi

      # O `npm run build` que existia aqui saiu: o build de verdade é o do
      # Docker, com as variáveis certas. Construir duas vezes com envs
      # diferentes era o que produzia dois bundles distintos.

  build:
    name: Build e publicar imagem
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.tag == '' }}
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      bundle: ${{ steps.bundle.outputs.nome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Definir a tag
        id: meta
        run: echo "tag=hml-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ Os valores vêm das Variables do repositório e são os MESMOS que
      # estavam no painel do Coolify (Environment Variables › build). Se a
      # chave do Supabase vier errada, o Dockerfile falha o build de propósito
      # — `supabase.ts` lança no import e a tela ficaria branca.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            VITE_API_URL=${{ vars.VITE_API_URL_HML }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL_HML }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY_HML }}
            VITE_WHATSAPP_NUMBER=${{ vars.VITE_WHATSAPP_NUMBER }}
            VITE_FEEDBACK_EMAIL=${{ vars.VITE_FEEDBACK_EMAIL }}
            VITE_FEEDBACK_MIN_NAVIGATIONS=${{ vars.VITE_FEEDBACK_MIN_NAVIGATIONS }}
          tags: |
            ${{ env.IMAGEM }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGEM }}:hml
          cache-from: type=gha,scope=frontend-hml
          cache-to: type=gha,mode=max,scope=frontend-hml

      # O hash esperado sai da PRÓPRIA imagem publicada, não de um build
      # paralelo. É isso que torna a confirmação exata.
      - name: Ler o hash do bundle dentro da imagem
        id: bundle
        run: |
          nome=$(docker run --rm --entrypoint sh "$IMAGEM:${{ steps.meta.outputs.tag }}" \
                   -c 'ls /usr/share/nginx/html/assets/index-*.js' | head -1 | sed 's|/usr/share/nginx/html||')
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "bundle desta imagem: $nome"

  deploy:
    name: Deploy em homologação
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: |
      always()
      && needs.validate.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')

    env:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      TAG: ${{ inputs.tag || needs.build.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Anotar o bundle que está no ar agora
        id: antes
        run: |
          atual=$(curl -s --max-time 25 https://hml.marketdash.com.br/ \
                  | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -1)
          echo "nome=$atual" >> "$GITHUB_OUTPUT"
          echo "no ar antes do deploy: ${atual:-(não consegui ler)}"

      - name: Deploy
        run: |
          chmod +x .github/scripts/deploy-imagem.sh
          .github/scripts/deploy-imagem.sh frontend \
            "${{ secrets.COOLIFY_DEPLOY_URL_FRONTEND_HML }}" \
            "$IMAGEM" "$TAG"

      - name: Confirmar que o bundle novo está no ar
        run: |
          chmod +x .github/scripts/confirmar-bundle.sh
          .github/scripts/confirmar-bundle.sh \
            "https://hml.marketdash.com.br" \
            "${{ steps.antes.outputs.nome }}" \
            "${{ needs.build.outputs.bundle }}"

      # Segunda prova, e mais específica: diz QUAL commit está servido.
      - name: Confirmar a versão
        run: |
          for i in $(seq 1 20); do
            v=$(curl -s --max-time 20 https://hml.marketdash.com.br/version.json | jq -r '.version // empty')
            [ "$v" = "${{ github.sha }}" ] && { echo "✅ version.json = $v"; exit 0; }
            [ -n "${{ inputs.tag }}" ] && { echo "ℹ️ redeploy de tag: version.json = $v"; exit 0; }
            echo "   [$((i*10))s] version.json: ${v:-(sem resposta)}"
            sleep 10
          done
          echo "::error::version.json não passou a responder ${{ github.sha }}"
          exit 1
